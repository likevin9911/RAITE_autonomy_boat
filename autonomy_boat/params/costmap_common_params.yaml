origin_z: 0.0
z_resolution: 1
z_voxels: 2

obstacle_range: 2.5
raytrace_range: 3.0

publish_voxel_map: false
transform_tolerance: 0.6
meter_scoring: true

footprint: [[-0.6, -0.4], [-0.6, 0.4], [0.5, 0.4], [0.5, -0.4]]
# footprint: [[-1.5, -0.85], [-1.5, 0.85], [1.3, 0.85], [1.3, -0.85]]

footprint_padding: 0.0

plugins:

- {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
- {name: inflater_layer, type: "costmap_2d::InflationLayer"}

obstacles_layer:
  observation_sources: scan
  scan: {sensor_frame: front_laser, data_type: LaserScan, topic: /scan, expected_update_rate: 0, marking: true, clearing: true, min_obstacle_height: -7.0, max_obstacle_height: 7.0, obstacle_range: 9, raytrace_range: 100.0}
#/sensors/lidars/lidar/scan
inflater_layer:
 inflation_radius: 0.5
