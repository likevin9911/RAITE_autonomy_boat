MpcLocalPlannerROS:
  odom_topic: odom

  ## Robot settings
  robot:
    type: "simple_car"
    simple_car:
      wheelbase: 0.5
      front_wheel_driving: False
      max_vel_x: 0.25
      max_vel_x_backwards: 0.1
      max_steering_angle: 0.25
      acc_lim_x: 0.2
      dec_lim_x: 0.2
      max_steering_rate: 0.25

  ## Footprint model for collision avoidance
  footprint_model:
    type: "polygon"
    vertices: 
      - [-0.6, -0.4]
      - [-0.6,  0.4]
      - [ 0.5,  0.4]
      - [ 0.5, -0.4]
    is_footprint_dynamic: False

  ## Collision avoidance
  collision_avoidance:
    min_obstacle_dist: 0.3
    enable_dynamic_obstacles: False
    force_inclusion_dist: 0.6
    cutoff_dist: 3.0 
    include_costmap_obstacles: True
    costmap_obstacles_behind_robot_dist: 1.5
    collision_check_no_poses: 10

  ## Planning grid 
  grid:
    type: "fd_grid"
    grid_size_ref: 15
    dt_ref: 0.4
    xf_fixed: [True, True, True]
    warm_start: True
    collocation_method: "forward_differences"
    cost_integration_method: "left_sum"  # Reverted to default
    variable_grid:
      enable: True
      min_dt: 0.3
      max_dt: 4.0
      grid_adaptation:
        enable: True
        dt_hyst_ratio: 0.15
        min_grid_size: 3
        max_grid_size: 40

  ## Planning options
  planning:
    objective:
      type: "quadratic_form"
      quadratic_form:
        state_weights: [2.0, 2.0, 1.0]
        control_weights: [0.02, 0.02]
        integral_form: False
    terminal_cost:
      type: "quadratic"
      quadratic:
        final_state_weights: [5.0, 5.0, 1.0]
    terminal_constraint:
      type: "none"

  ## Controller options
  controller:
    outer_ocp_iterations: 1
    xy_goal_tolerance: 0.2
    yaw_goal_tolerance: 0.1
    global_plan_overwrite_orientation: True
    global_plan_prune_distance: 1.0
    allow_init_with_backward_motion: True
    max_global_plan_lookahead_dist: 1.5  # Reverted to original
    force_reinit_new_goal_dist: 1.0
    force_reinit_new_goal_angular: 1.57
    prefer_x_feedback: True  # Re-enabled for better control
    publish_ocp_results: False

  ## Solver settings
  solver:
    type: "ipopt"
    ipopt:
      iterations: 200  # Adjusted for better convergence
      max_cpu_time: 2.0
      ipopt_numeric_options:
        tol: 1e-6
      ipopt_string_options:
        linear_solver: "mumps"  # Reverted to default
        hessian_approximation: "limited-memory"
    lsq_lm:
      iterations: 10
      weight_init_eq: 2
      weight_init_ineq: 2
      weight_init_bounds: 2
      weight_adapt_factor_eq: 1.5
      weight_adapt_factor_ineq: 1.5
      weight_adapt_factor_bounds: 1.5
      weight_adapt_max_eq: 500
      weight_adapt_max_ineq: 500
      weight_adapt_max_bounds: 500

  ## Move Base Params
  shutdown_costmaps: false
