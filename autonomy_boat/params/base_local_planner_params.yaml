TrajectoryPlannerROS:

  # Robot Configuration Parameters
  acc_lim_x: 3.0  # Increased from 2.0
  acc_lim_theta: 2.0

  max_vel_x: 1.0
  min_vel_x: 0.5  # Increased from 0.0

  max_vel_theta: 2.0
  min_vel_theta: -2.0
  min_in_place_vel_theta: 0.314

  holonomic_robot: false
  escape_vel: 0.5

  # Goal Tolerance Parameters
  yaw_goal_tolerance: 3
  xy_goal_tolerance: 4
  latch_xy_goal_tolerance: false

  # Forward Simulation Parameters
  sim_time: 5.0
  sim_granularity: 0.02
  angular_sim_granularity: 0.02
  vx_samples: 30  # Increased from 20
  vtheta_samples: 60  # Increased from 50
  controller_frequency: 30.0  # Increased from 20.0

  # Trajectory scoring parameters
  pdist_scale: 0.6  # Slightly increased from 0.5
  gdist_scale: 0.3  # Increased from 0.2

  meter_scoring: true
  occdist_scale: 0.02
  path_distance_bias: 0.5  # Decreased from 0.7
  goal_distance_bias: 1.5  # Increased from 1.2

  heading_lookahead: 0.6  # Increased from 0.5
  heading_scoring: true
  heading_scoring_timestep: 1.0
  dwa: true
  simple_attractor: false
  publish_cost_grid_pc: true

  # Oscillation Prevention Parameters
  oscillation_reset_dist: 0.1
  escape_reset_dist: 0.2
  escape_reset_theta: 0.2

  allow_reverse: false
  publish_feedback: true  # Enabled for visualization

